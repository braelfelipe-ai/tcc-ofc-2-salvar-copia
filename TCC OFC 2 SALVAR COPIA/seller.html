<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel do vendedor — Amora</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f9;
      color: #172235;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --navy: #101d31;
      --navy-soft: #1b2b43;
      --gold: #c9973a;
      --muted: #738096;
      --line: #e4e9f0;
      --shadow: 0 18px 48px rgba(20, 34, 54, .08);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(201, 151, 58, .09), transparent 34rem),
        #f4f6f9;
    }
    main { width: min(1080px, calc(100% - 40px)); margin: 48px auto; }
    header, .panel {
      padding: 28px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(221, 228, 237, .9);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    header {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
      overflow: hidden;
    }
    header::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: linear-gradient(180deg, #e3b95f, var(--gold));
      content: "";
    }
    .brand { display: flex; align-items: center; gap: 15px; }
    .brand-mark {
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(201, 151, 58, .32);
      border-radius: 14px;
      background: #fbf6ea;
      color: #a97820;
      font-size: .88rem;
      font-weight: 900;
      letter-spacing: .04em;
    }
    .eyebrow {
      margin-bottom: 5px;
      color: #a97820;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .store-link { color: #65738a; font-size: .86rem; font-weight: 700; text-decoration: none; }
    .store-link:hover { color: #a97820; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 4px; color: var(--navy); font-size: clamp(1.3rem, 3vw, 1.65rem); letter-spacing: -.04em; }
    h2 { margin-bottom: 7px; color: var(--navy); font-size: 1.18rem; letter-spacing: -.025em; }
    .muted { color: var(--muted); }
    .panel { margin-bottom: 22px; }
    #loginPanel { max-width: 620px; margin: 36px auto; padding: 34px; }
    #loginPanel h2 { font-size: 1.35rem; }
    label { display: block; margin: 22px 0 8px; color: #334157; font-size: .88rem; font-weight: 750; }
    input {
      width: 100%;
      max-width: 480px;
      padding: 13px 15px;
      border: 1px solid #d8e0ea;
      border-radius: 10px;
      outline: none;
      background: #fbfcfe;
      color: var(--navy);
      font: inherit;
      transition: border-color .18s, box-shadow .18s;
    }
    input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(201, 151, 58, .14); }
    button {
      padding: 11px 16px;
      border: 1px solid var(--navy);
      border-radius: 10px;
      background: var(--navy);
      color: #fff;
      font: inherit;
      font-size: .88rem;
      font-weight: 750;
      cursor: pointer;
      transition: transform .16s, background .16s, box-shadow .16s;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); background: var(--navy-soft); box-shadow: 0 7px 18px rgba(16, 29, 49, .16); }
    button:focus-visible, a:focus-visible { outline: 3px solid rgba(201, 151, 58, .6); outline-offset: 3px; }
    button:disabled { opacity: .58; cursor: wait; }
    #loginButton { min-width: 140px; margin-top: 5px; }
    .secondary { border-color: #e1e6ee; background: #f7f8fa; color: #35435a; }
    .secondary:hover:not(:disabled) { border-color: #d2dae5; background: #edf1f6; box-shadow: none; }
    .order { margin: 16px 0; padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: #fff; transition: box-shadow .2s, border-color .2s; }
    .order:hover { border-color: #d5deea; box-shadow: 0 10px 26px rgba(20, 34, 54, .06); }
    .order-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .order-head strong, .order-details strong { display: block; margin-bottom: 5px; color: #435169; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
    .order-id { overflow-wrap: anywhere; color: #485871; font-family: "SFMono-Regular", Consolas, monospace; font-size: .82rem; }
    .amount { margin-bottom: 5px; color: var(--navy); font-size: 1.42rem; font-weight: 850; letter-spacing: -.03em; }
    .pending, .paid { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: .76rem; font-weight: 750; }
    .pending { background: #fff5df; color: #895e0c; }
    .paid { background: #e8f7ed; color: #187444; }
    .order-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 13px; margin: 20px 0; }
    .order-details > div { min-width: 0; padding: 15px; border: 1px solid #edf0f4; border-radius: 11px; background: #fafbfd; }
    .order-details p { margin: 0 0 5px; overflow-wrap: anywhere; color: #536178; font-size: .88rem; }
    .items { margin: 6px 0 0; padding-left: 18px; color: #536178; font-size: .88rem; }
    .order > p { color: #66748a; font-size: .84rem; overflow-wrap: anywhere; }
    .order > button { margin-top: 3px; }
    #loginError, #dashboardError { color: #a12c2c; }
    #loginError, #dashboardError:not([hidden]) { padding: 11px 13px; border: 1px solid #f0d0d0; border-radius: 9px; background: #fff5f5; }
    #ordersPanel > .order-head { align-items: center; padding-bottom: 17px; border-bottom: 1px solid #edf0f4; }
    #ordersPanel > .order-head h2 { margin-bottom: 4px; font-size: 1.35rem; }
    #ordersPanel > .order-head p { margin-bottom: 0; font-size: .88rem; }
    #ordersList > .muted { padding: 38px 14px; text-align: center; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      main { width: min(100% - 22px, 1080px); margin: 18px auto; }
      header, .panel { padding: 19px; border-radius: 14px; }
      header { align-items: flex-start; }
      .brand { align-items: flex-start; gap: 11px; }
      .brand-mark { width: 42px; height: 42px; border-radius: 12px; }
      .header-actions { flex-direction: column-reverse; align-items: flex-end; gap: 10px; }
      .store-link { white-space: nowrap; font-size: .76rem; }
      #loginPanel { margin: 22px auto; padding: 24px 20px; }
      .order { padding: 17px; }
      .order-details { grid-template-columns: 1fr; }
      #ordersPanel > .order-head { align-items: flex-start; }
      #refreshButton { padding: 9px 11px; font-size: .78rem; }
    }
  </style>
  <script src="/seller.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">a</div>
        <div>
          <p class="eyebrow">Amora · Área administrativa</p>
          <h1>Painel do vendedor</h1>
          <p class="muted" style="margin:0">Confira o Pix no seu banco antes de marcar um pedido como pago.</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="store-link" href="/">Voltar à loja</a>
        <button id="logoutButton" class="secondary" type="button" hidden>Sair</button>
      </div>
    </header>

    <section id="loginPanel" class="panel">
      <h2>Acesso do vendedor</h2>
      <form id="loginForm">
        <label for="sellerPassword">Senha do vendedor</label>
        <input id="sellerPassword" name="password" type="password" autocomplete="current-password" required>
        <p id="loginError" role="alert" hidden></p>
        <button id="loginButton" type="submit">Entrar</button>
      </form>
    </section>

    <section id="ordersPanel" class="panel" hidden>
      <div class="order-head">
        <div>
          <h2>Pedidos</h2>
          <p class="muted">Até 200 pedidos recentes. Atualize para buscar novos.</p>
        </div>
        <button id="refreshButton" class="secondary" type="button">Atualizar pedidos</button>
      </div>
      <p id="dashboardError" role="alert" hidden></p>
      <div id="ordersList" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
